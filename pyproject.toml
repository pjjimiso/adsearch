[project]
name = "adsearch"
version = "0.1.0"
description = "A CLI for searching Active Directory"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ldap3>=2.9.1",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
sources = ["src"]
include = [
    "src/adsearch/**/*.py",
    "src/adsearch/py.typed",
]
[project.scripts]
adsearch = "adsearch.cli:main"
